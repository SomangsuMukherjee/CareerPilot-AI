<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CareerPilot AI — Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080c14;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      width: 420px;
      background: #111827;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      color: #94a3b8;
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: #0d1525;
      color: white;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }

    .switch {
      margin-top: 18px;
      text-align: center;
      color: #94a3b8;
      cursor: pointer;
    }

    .error {
      color: #fca5a5;
      margin-top: 12px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="title">Login</h1>
    <p>Access your CareerPilot dashboard.</p>

    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />

    <button onclick="submitAuth()">Continue</button>

    <div class="switch" onclick="toggleMode()" id="switchText">
      New here? Create an account
    </div>

    <div class="error" id="errorBox"></div>
  </div>

  <script>
    const API = "https://careerpilot-api-w6il.onrender.com";
    let mode = "login";

    if (localStorage.getItem("token")) {
      window.location.href = "dashboard.html";
    }

    function toggleMode() {
      mode = mode === "login" ? "register" : "login";

      document.getElementById("title").textContent =
        mode === "login" ? "Login" : "Create Account";

      document.getElementById("switchText").textContent =
        mode === "login"
          ? "New here? Create an account"
          : "Already have an account? Login";

      document.getElementById("errorBox").textContent = "";
    }

    async function submitAuth() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        document.getElementById("errorBox").textContent = "Email and password are required.";
        return;
      }

      const endpoint = mode === "login" ? "/auth/login" : "/auth/register";

      const response = await fetch(`${API}${endpoint}`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (!response.ok) {
        document.getElementById("errorBox").textContent = data.detail || "Authentication failed.";
        return;
      }

      localStorage.setItem("token", data.access_token);
      localStorage.setItem("userEmail", data.user.email);

      window.location.href = "dashboard.html";
    }
  </script>

</body>
</html>
